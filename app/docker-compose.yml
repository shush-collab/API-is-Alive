services:
  gateway:
    build: ./apps/gateway
    ports:
      - "4000:4000"
    environment:
      GATEWAY_PORT: 4000
      UPSTREAM_URL: http://fake-api:5000
      MONGO_URL: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
      - fake-api

  fake-api:
    build: ./apps/fake-api
    ports:
      - "5000:5000"
    environment:
      FAKE_API_PORT: 5000

  worker:
    build: ./apps/worker
    environment:
      MONGO_URL: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  dashboard:
    build: ./apps/dashboard
    ports:
      - "3000:3000"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      GATEWAY_PORT: 4000
      UPSTREAM_URL: http://fake-api:5000
      MONGO_URL: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: dev-admin-token
      API_KEY_PEPPER: dev-api-key-pepper
      KAFKA_BROKERS: kafka:9092
      KAFKA_REQUEST_EVENTS_TOPIC: request-events
      KAFKA_CLIENT_ID: api-is-alive-gateway
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fake-api:
        condition: service_started
      seed:
        condition: service_completed_successfully

  fake-api:
    build:
      context: .
      dockerfile: apps/fake-api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      FAKE_API_PORT: 5000

  seed:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    command: npm run seed
    environment:
      MONGO_URL: mongodb://mongo:27017/sentinel
      API_KEY_PEPPER: dev-api-key-pepper
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_REQUEST_EVENTS_TOPIC: request-events
      KAFKA_RISK_WORKER_GROUP_ID: risk-worker
      KAFKA_CLIENT_ID: api-is-alive-worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  dashboard:
    build: ./apps/dashboard
    ports:
      - "3000:3000"
    environment:
      VITE_GATEWAY_URL: http://localhost:4000
      VITE_ADMIN_TOKEN: dev-admin-token
    depends_on:
      gateway:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
